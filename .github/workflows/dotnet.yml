name: .NET Build & Release

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*' 
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      run: dotnet test --configuration Release

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Executable (Windows x64)
      run: |
        dotnet publish BattleNGDP.csproj \
          -c Release \
          -r win-x64 \
          -p:PublishSingleFile=true \
          -p:SelfContained=true \
          -p:Version=${{ github.ref_name }} \
          -o ./publish/windows

    - name: Publish Executable (Linux x64)
      run: |
        dotnet publish BattleNGDP.csproj \
          -c Release \
          -r linux-x64 \
          -p:PublishSingleFile=true \
          -p:SelfContained=true \
          -p:Version=${{ github.ref_name }} \
          -o ./publish/linux

    - name: Zip Artifacts
      run: |
        cd publish/windows && zip -r ../../BattleNGDP-win-x64.zip . && cd ../..
        cd publish/linux && zip -r ../../BattleNGDP-linux-x64.zip . && cd ../..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          BattleNGDP-win-x64.zip
          BattleNGDP-linux-x64.zip
        generate_release_notes: true 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
